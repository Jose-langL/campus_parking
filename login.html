<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión | Campus Parking</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Estilos/Estilos.css">
    <link rel="stylesheet" href="./Estilos/responsive.css">
</head>
<body>
    <main class="main-login">

    <div class="Contendor-login">
            <h1>Campus Parking</h1>
            <p class="login-subtitulo">Ingresa tus datos para continuar</p>

            <div class="inputs">
                <input type="text" placeholder="Usuario" required id="Usuario" autocomplete="username">
                <i class="bxf bx-user"></i>
            </div>

             <div class="inputs">
                <input type="email" placeholder="Correo electrónico" required id="email" autocomplete="email">
                <i class="bxf bx-envelope"></i>
            </div>

            <div class="inputs">
                <input type="password" placeholder="Contraseña" required id="Contraseña" autocomplete="current-password">
                <i class="bxf bx-lock-keyhole"></i>
            </div>
            
            <button class="btn-login" id="LoginButton" type="button">Iniciar sesión</button>
    </div>
    </main>
    
     <script src="./JavaScript/login.js"></script>
</body>
</html
